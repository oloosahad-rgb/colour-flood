name: Deploy to itch.io

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install and Run Butler
        run: |
          curl -L -o butler.zip https://itch.ovh
          unzip butler.zip
          chmod +x butler
          ./butler push . oloosahad/colour-flood:html5 --key ${{ secrets.ITCH_IO_API_KEY }}
